[package]
name = "conwayskingdom"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "native"
path = "src/bin/native.rs"
required-features = ["render"]

[[bin]]
name = "server"
path = "src/bin/server.rs"

[features]
default = ["render"]
# Everything that touches the GPU or a window. Off, the server builds with
# neither wgpu nor winit compiled at all.
render = ["dep:wgpu", "dep:winit"]

[dependencies]
wgpu = { version = "30", optional = true }
winit = { version = "0.29", optional = true }
bytemuck = { version = "1.16", features = ["derive", "extern_crate_alloc", "min_const_generics"] }
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgl"], optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Window", "HtmlCanvasElement", "Performance"] }
console_error_panic_hook = "0.1"
console_log = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
pollster = "0.3"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
