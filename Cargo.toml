[package]
name = "conwayskingdom"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "native"
path = "src/bin/native.rs"
required-features = ["render"]

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]

# Art tooling. Needs only `png`, so it builds under any feature set -- which
# matters because the crate embeds the sprites with `include_bytes!` and so
# cannot build until they exist.
[[bin]]
name = "cnvt"
path = "tools/cnvt.rs"

[[bin]]
name = "strip"
path = "tools/strip.rs"

[features]
default = ["render"]
# Everything that touches the GPU or a window. Off, the server builds with
# neither wgpu nor winit compiled at all.
render = ["dep:wgpu", "dep:winit", "dep:egui", "dep:egui-wgpu"]
# The websocket server. Native only.
server = ["dep:axum", "dep:tower-http"]

[dependencies]
wgpu = { version = "30", optional = true }
winit = { version = "0.30.13", optional = true }
# UI. egui-wgpu tracks wgpu 30, and egui-winit tracks winit 0.30 -- which is why
# winit moved up: the two must share one window and one wgpu.
egui = { version = "0.36", optional = true }
egui-wgpu = { version = "0.36", optional = true }
bytemuck = { version = "1.16", features = ["derive", "extern_crate_alloc", "min_const_generics"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
# Decoding an atlas sheet. Tiny, pure Rust, and builds for wasm.
png = "0.18"

# Server transport. Optional so the client, and a wasm build, pull none of it.
axum = { version = "0.8", features = ["ws"], optional = true }

tower-http = { version = "0.6", features = ["fs"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgl"], optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document", "Element", "Window", "HtmlCanvasElement", "Performance",
    "WebSocket", "MessageEvent", "BinaryType", "Location", "CloseEvent", "Event",
    "Storage",
] }
console_error_panic_hook = "0.1"
console_log = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
pollster = "0.3"
# Transport, for both the server and the native client. Native only: a browser
# has no sockets to give tokio, so the wasm client will use the browser's own
# WebSocket instead.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# wasm-pack runs wasm-opt over the module after wasm-bindgen, and on a build
# this size that is most of the wall clock: about ninety seconds against a
# minute and a half of compiling. It earns it for a build that ships -- 12.1 MB
# down to 7.5 MB -- and does not for one served from localhost, so the
# profiling build skips it. Same release codegen, no second optimiser:
#
#     wasm-pack build --profiling --target web   # iterating
#     wasm-pack build --target web               # shipping
[package.metadata.wasm-pack.profile.profiling]
wasm-opt = false

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
