<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <!-- Without this a mobile browser lays the page out at 980 CSS pixels, the
       width it assumes a page written for desktops wants, and then scales the
       result down to fit the screen: on a phone everything comes out at about
       forty per cent and the HUD is unreadable. `device-width` says the page
       knows what it is doing.

       Scaling is pinned off because the game has a pinch of its own. Left on,
       the browser's zoom and the world's fight over the same gesture, and the
       one that wins is the one that got the event first. `touch-action: none`
       on the canvas is the other half of that. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>ConwaysKingdom</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;

      /* The browser decides what a gesture means from this, and it decides
         before it delivers an event anyone can cancel. Left at `auto` it takes
         a two-finger pinch as page zoom and a drag as a scroll, and winit's
         preventDefault never gets a say -- the events arrive non-cancelable,
         or as a pointercancel once the browser has claimed the gesture. `none`
         says the page wants every touch itself, which is what makes pinch and
         drag reach the game at all. */
      touch-action: none;
    }

    #error {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 1rem;
      color: #f66;
      font: 12px/1.5 ui-monospace, monospace;
      white-space: pre-wrap;
      background: #000;
    }
  </style>
</head>

<body>
  <script type="module">
    // wasm-pack names its output after the crate, so this is pkg/<crate>.js —
    // `conwayskingdom`, per the `name` in Cargo.toml. Rename here if the crate
    // is ever renamed, or the browser gets the server's 404 page and refuses
    // it as "disallowed MIME type (text/html)".
    import init from "./pkg/conwayskingdom.js";

    init().catch((e) => {
      const pre = document.createElement("pre");
      pre.id = "error";
      pre.textContent = String(e && e.stack ? e.stack : e);
      document.body.appendChild(pre);
      console.error(e);
    });
  </script>
</body>

</html>
