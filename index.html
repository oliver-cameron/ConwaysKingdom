<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <!-- Without this a mobile browser lays the page out at 980 CSS pixels, the
       width it assumes a page written for desktops wants, and then scales the
       result down to fit the screen: on a phone everything comes out at about
       forty per cent and the HUD is unreadable. `device-width` says the page
       knows what it is doing.

       Scaling is pinned off because the game has a pinch of its own. Left on,
       the browser's zoom and the world's fight over the same gesture, and the
       one that wins is the one that got the event first. `touch-action: none`
       on the canvas is the other half of that. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>ConwaysKingdom</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;

      /* The other half of stopping a sideways pan from going back a page.
         The canvas cancels the wheel events it sees; this says the page has
         nowhere to scroll to in the first place, which also covers the
         gestures a browser decides on before anybody gets an event. */
      overscroll-behavior: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;

      /* winit no longer calls preventDefault on everything -- see
         `render::app` -- so a drag across the canvas would start selecting
         the page instead of drawing. */
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;

      /* The browser decides what a gesture means from this, and it decides
         before it delivers an event anyone can cancel. Left at `auto` it takes
         a two-finger pinch as page zoom and a drag as a scroll, and winit's
         preventDefault never gets a say -- the events arrive non-cancelable,
         or as a pointercancel once the browser has claimed the gesture. `none`
         says the page wants every touch itself, which is what makes pinch and
         drag reach the game at all. */
      touch-action: none;
    }

    /* **Something to look at while the module arrives.**
       The page was black and empty until wasm-bindgen finished, which for a
       7.5 MB module on a phone is several seconds of nothing — and a blank
       screen is indistinguishable from a broken one, so the wait reads as a
       client that cannot reach the server rather than as a client that has
       not started. Near-black ground and one accent, which is what the game
       is; see src/client/views/theme.rs. */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      background: #090a0d;
      color: #818898;
      font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
      transition: opacity 0.2s ease-out;
    }

    #loading.done {
      opacity: 0;
      pointer-events: none;
    }

    #loading .name {
      color: #e2e5ec;
      font-size: 17px;
    }

    /* A bar rather than a spinner: 7.5 MB on a phone is long enough that
       "how much longer" is a real question, and a spinner answers it with
       "unknown" forever. It falls back to an indeterminate sweep when the
       server sends no Content-Length, because a bar that cannot fill is
       worse than one that never claimed it could. */
    #bar {
      width: min(260px, 60vw);
      height: 3px;
      background: #20222a;
      border-radius: 2px;
      overflow: hidden;
    }

    #bar i {
      display: block;
      height: 100%;
      width: 0;
      background: #7ac4ff;
      transition: width 0.15s linear;
    }

    #bar.unknown i {
      width: 40%;
      animation: sweep 1.1s ease-in-out infinite;
    }

    @keyframes sweep {
      0% { margin-left: -40%; }
      100% { margin-left: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      #bar.unknown i { animation: none; width: 100%; opacity: 0.4; }
      #loading { transition: none; }
    }

    #error {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 1rem;
      color: #f66;
      font: 12px/1.5 ui-monospace, monospace;
      white-space: pre-wrap;
      background: #000;
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="name">Conway's Kingdom</div>
    <div id="bar"><i></i></div>
    <div id="say">Loading</div>
  </div>
  <!-- **A classic script, before the module, and that is the whole point.**
       If the module fails to load — `pkg/` is generated by wasm-pack and is
       not in the repository, so a fresh checkout has none — then the whole
       `type="module"` block never runs, *including its own error handling*.
       The loading panel is plain HTML that is already on the page, so it sits
       there saying "Loading" for ever with nothing to say why. That is a
       silent hang, and it looks exactly like a game that cannot reach its
       server.

       This runs whatever happens, and turns that into a sentence. -->
  <script>
    (function () {
      var say = document.getElementById("say");
      var bar = document.getElementById("bar");
      var told = false;

      window.__ckSay = function (what, detail) {
        if (told) return;
        told = true;
        if (bar) bar.style.display = "none";
        if (say) {
          say.style.color = "#e87a70";
          say.style.maxWidth = "min(520px, 80vw)";
          say.style.textAlign = "center";
          say.textContent = detail ? what + "\n\n" + detail : what;
          say.style.whiteSpace = "pre-wrap";
        }
        console.error(what, detail || "");
      };

      // A module that fails to load reports here and nowhere else.
      window.addEventListener("error", function (e) {
        window.__ckSay(
          "The game did not load.",
          (e && e.message) || "Its script could not be fetched or run."
        );
      });
      window.addEventListener("unhandledrejection", function (e) {
        window.__ckSay("The game did not load.", String((e && e.reason) || ""));
      });

      // And a failure that reports nothing at all — a 404 on the module is one
      // — is caught by waiting. The module sets this flag on its first line,
      // so reaching the timer means it never ran.
      setTimeout(function () {
        if (window.__ckStarted) return;
        window.__ckSay(
          "The game did not load.",
          "pkg/ is missing or could not be served. It is generated, not " +
            "committed:\n\n    wasm-pack build --target web\n\n" +
            "then serve this directory again."
        );
      }, 8000);
    })();
  </script>

  <script type="module">
    // Told first, so the watchdog above knows this ran at all.
    window.__ckStarted = true;

    // **Absolute, because every screen is a path and the module is not under
    // any of them.** A relative `./pkg/…` resolves against the *document's*
    // URL, dropping everything after the last slash in its path — so at `/`
    // and at `/?room=main` it means `/pkg/…` and works, and at `/room/main`
    // it means `/room/pkg/…`, which `serve_client` answers with a 404 because
    // `nest_service("/pkg", …)` matches only `/pkg/*`. The module then never
    // loads, and because this is an ES import the whole `type="module"` block
    // never runs — including its own try/catch — so the failure arrives eight
    // seconds later from the watchdog above, blaming a `pkg/` that is fine.
    //
    // Relative was restored once on the grounds that absolute assumes the
    // client is mounted at the origin's root, which a page cannot promise
    // about wherever somebody has put it. It can here: `serve_client` mounts
    // it at the root by construction — `route_service("/")` for the page and
    // `nest_service("/pkg", …)` for the module — so there is no other mount
    // point for the promise to be wrong about. The objection is real and it
    // is about a server this repository does not have. If one ever does,
    // `<base href="/">` is not the answer either: it silently retargets every
    // other relative URL on the page, which is a wider promise than this one.
    //
    // wasm-pack names its output after the crate, so this is /pkg/<crate>.js —
    // `conwayskingdom`, per the `name` in Cargo.toml. Rename here if the crate
    // is ever renamed, or the browser gets the server's 404 page and refuses
    // it as "disallowed MIME type (text/html)".
    import init from "/pkg/conwayskingdom.js";

    const loading = document.getElementById("loading");
    const bar = document.getElementById("bar");
    const fill = bar.querySelector("i");
    const say = document.getElementById("say");

    // Fetched by hand rather than left to `init()`, for one reason: a
    // Content-Length gives a percentage, and several seconds of silence is
    // what made the wait read as a failure. Streaming compilation is given up
    // to get it, which is a fair trade at this size — the compile is not the
    // part anybody is waiting on.
    async function load() {
      // Absolute for the reason the import above is.
      const response = await fetch("/pkg/conwayskingdom_bg.wasm");
      if (!response.ok) throw new Error(`${response.status} fetching the module`);

      // Through an edge that compresses the module on the way, the length
      // arrives under the second name -- see `server::ws::cached`.
      const total =
        Number(response.headers.get("content-length") || response.headers.get("x-content-length")) || 0;
      if (!total || !response.body) {
        // No length, or no stream to read it with: an indeterminate sweep
        // rather than a bar that pretends to know.
        bar.classList.add("unknown");
        return await response.arrayBuffer();
      }

      const reader = response.body.getReader();
      const chunks = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        got += value.length;
        fill.style.width = `${Math.min(100, (got / total) * 100)}%`;
        say.textContent = `Loading ${Math.round(got / 1e5) / 10} of ${Math.round(total / 1e5) / 10} MB`;
      }
      const bytes = new Uint8Array(got);
      let at = 0;
      for (const chunk of chunks) {
        bytes.set(chunk, at);
        at += chunk.length;
      }
      return bytes;
    }

    try {
      const module_or_path = await load();
      // Named stages, so a stall says which one. "Loading" for ever and
      // "Starting" for ever are different faults: the first is the download,
      // the second is the module refusing to instantiate or run.
      say.textContent = "Starting";
      bar.classList.add("unknown");
      // **The bytes, not `{ module_or_path: bytes }`.** Both forms work with a
      // current wasm-bindgen; only this one works with an older module. `pkg/`
      // is generated and gitignored, so a working copy keeps whatever
      // wasm-pack last wrote there while this page moves on — and a page that
      // calls the newer form against an older module fails in a way that looks
      // like everything else on this screen.
      //
      // A `Uint8Array` is not a plain object, so the newer init passes it
      // straight through as the module rather than trying to destructure it.
      await init(module_or_path);
      loading.classList.add("done");
      // Removed rather than hidden, so nothing of it is left over the canvas
      // to swallow a press.
      setTimeout(() => loading.remove(), 300);
      // And if the app started but never put a canvas on the page, say so
      // rather than leaving a black screen: that is a different fault from
      // anything above and used to look identical to all of them.
      setTimeout(function () {
        if (!document.querySelector("canvas")) {
          document.body.appendChild(loading);
          loading.classList.remove("done");
          window.__ckSay(
            "The game started but drew nothing.",
            "No canvas was created. The console will have the reason."
          );
        }
      }, 4000);
    } catch (e) {
      // Into the panel that is already on screen rather than a bare <pre>
      // behind it: whatever went wrong, the person is looking at the panel.
      window.__ckSay("The game did not load.", String(e && e.stack ? e.stack : e));
      console.error(e);
    }
  </script>
</body>

</html>
